[project]
name = "job-agent"
version = "0.1.0"
description = "Local-LLM agent that scouts fresher-friendly startup jobs into a daily Excel workbook"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=21",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
